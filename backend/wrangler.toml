name = "fold-commons-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# The Fold SF's Cloudflare account. Pinned explicitly because this machine is
# logged into other Cloudflare accounts (Raybox, Rheome) — without this line
# wrangler silently picks the default one and would create/deploy The Fold's
# infrastructure in the wrong account.
account_id = "3e871b0b1eb6ba48da27e2b9bd6a667d"

# R2 bucket that stores the community photo library. Objects are keyed by
# their generated id; w/h/name live as custom metadata (see src/index.ts).
[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "fold-commons"

# Comma-separated list of origins allowed to call this worker. Each entry may
# contain `*`, which matches only [A-Za-z0-9-] and so cannot cross a dot —
# "https://fold-commons-*.vercel.app" covers Vercel preview deployments
# without also matching "https://fold-commons-x.attacker.com".
#
# The first entry is the canonical production origin: it is what a caller with
# no Origin header at all (curl, server-to-server) gets back.
#
# Local dev is deliberately absent. Point a local frontend at a local worker
# (`bun run dev` here) rather than adding localhost to the deployed allowlist.
[vars]
ALLOWED_ORIGIN = "https://fold-commons.vercel.app,https://fold-commons-*.vercel.app"

# UPLOAD_TOKEN is a secret, not a var — never checked into wrangler.toml.
# Set it once per environment with:
#   wrangler secret put UPLOAD_TOKEN
# The worker reads it as env.UPLOAD_TOKEN and requires it on POST /photos
# and DELETE /gallery/:id via `Authorization: Bearer <token>`.

# D1 database backing the community gallery, feedback inbox, and signature
# tuning log (see schema.sql). Already created in the dashboard; paste its id
# below — `wrangler d1 list` prints it once authenticated to this account.
[[d1_databases]]
binding = "DB"
database_name = "fold-commons"
database_id = "9fe43ccf-de76-42f0-b351-724973fe1381"
